services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command: ['--config.file=/etc/prometheus/prometheus.yml','--web.listen-address=127.0.0.1:9106']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.2.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3026
      GF_SECURITY_ADMIN_USER: horizon-admin
      GF_SECURITY_ADMIN_PASSWORD: horizon-local-only
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
