name: verify

on:
  pull_request:
  push:
    branches:
      - feat/**

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: |
          (cd packages/contracts && dart test)
          (cd packages/halo_adapter && flutter test)
          (cd packages/audio_adapters && flutter test)
          (cd packages/translation_runtime && dart test)
          (cd apps/mobile && flutter test)
      - name: Repository preflight
        run: bash tooling/preflight.sh --all


  e2e-emulated:
    name: e2e-emulated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official halo-emulator (pinned SDK revision)
        run: |
          python -m venv "$RUNNER_TEMP/halo-emulator"
          "$RUNNER_TEMP/halo-emulator/bin/pip" install -r tooling/e2e/requirements-halo-emulator.txt
      - name: Setup Node (Console live-stream client probe)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve packages
        run: flutter pub get
      - name: E2E_EMULATED + LIVE_STREAM (providers SIMULATED, HUD EMULATED, never HALO_REAL)
        working-directory: apps/mobile
        env:
          HORIZON_E2E_PYTHON: ${{ runner.temp }}/halo-emulator/bin/python
          HORIZON_E2E_NODE: node
          HORIZON_E2E_REQUIRED: '1'
          HORIZON_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-emulated
        run: flutter test test/e2e
      - name: Upload emulated framebuffer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-emulated-framebuffers
          path: ${{ runner.temp }}/e2e-emulated
          if-no-files-found: warn

  android-apk:
    name: android-apk
    # Hosted image ships the Android SDK; no secrets: the debug APK is signed
    # with the auto-generated debug key. This compiles the Kotlin platform
    # code (never compiled in CI before) and runs its JVM unit tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build validation APK (debug, redacted validation log on)
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=HORIZON_VALIDATION_LOG=true
      - name: Kotlin unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-validation-apk-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/engineering-console/pnpm-lock.yaml
      - name: Install
        working-directory: apps/engineering-console
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: apps/engineering-console
        run: pnpm test
      - name: Type check
        working-directory: apps/engineering-console
        run: pnpm lint
      - name: Build
        working-directory: apps/engineering-console
        run: pnpm build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error