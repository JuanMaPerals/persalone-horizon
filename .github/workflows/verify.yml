name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: |
          (cd packages/contracts && dart test)
          (cd packages/halo_core && dart test)
          (cd packages/halo_adapter && flutter test)
          (cd packages/audio_adapters && flutter test)
          (cd packages/translation_runtime && dart test)
          (cd apps/companion && dart test)
          (cd apps/mobile && flutter test)
      - name: Repository preflight
        run: bash tooling/preflight.sh --all
      - name: CI and dependency supply-chain audits
        run: |
          bash tooling/ci_audit.sh
          bash tooling/ci_audit_test.sh
          bash tooling/dependency_audit.sh
          bash tooling/dependency_audit_test.sh


  e2e-emulated:
    name: e2e-emulated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official halo-emulator (pinned SDK revision)
        run: |
          python -m venv "$RUNNER_TEMP/halo-emulator"
          "$RUNNER_TEMP/halo-emulator/bin/pip" install -r tooling/e2e/requirements-halo-emulator.txt
      - name: Setup Node (Console live-stream client probe)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Resolve packages
        run: flutter pub get
      - name: E2E_EMULATED + LIVE_STREAM (providers SIMULATED, HUD EMULATED, never HALO_REAL)
        working-directory: apps/mobile
        env:
          HORIZON_E2E_PYTHON: ${{ runner.temp }}/halo-emulator/bin/python
          HORIZON_E2E_NODE: node
          HORIZON_E2E_REQUIRED: '1'
          HORIZON_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-emulated
        run: flutter test test/e2e
      - name: Official emulator transport (button reporter, framebuffer PNG)
        working-directory: packages/halo_emulator
        env:
          HORIZON_E2E_PYTHON: ${{ runner.temp }}/halo-emulator/bin/python
          HORIZON_E2E_REQUIRED: '1'
        run: dart test
      - name: Studio Companion Hello Halo journey (API, official emulator)
        working-directory: apps/companion
        env:
          HORIZON_E2E_PYTHON: ${{ runner.temp }}/halo-emulator/bin/python
          HORIZON_E2E_REQUIRED: '1'
        run: dart test
      - name: Upload emulated framebuffer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-emulated-framebuffers
          path: ${{ runner.temp }}/e2e-emulated
          if-no-files-found: warn

  android-apk:
    name: android-apk
    # Hosted image ships the Android SDK; no secrets: the debug APK is signed
    # with the auto-generated debug key. This compiles the Kotlin platform
    # code (never compiled in CI before) and runs its JVM unit tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build validation APK (debug, redacted validation log on)
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=HORIZON_VALIDATION_LOG=true
      - name: Kotlin unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Record the validation APK sha256
        working-directory: apps/mobile/build/app/outputs/flutter-apk
        run: |
          sha256sum app-debug.apk | tee app-debug.apk.sha256
          {
            echo '### Validation APK'
            echo
            echo "commit \`$GITHUB_SHA\`"
            echo
            echo "sha256 \`$(cut -d' ' -f1 app-debug.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horizon-validation-apk-debug
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  apk-provenance:
    name: apk-provenance
    # Signed build provenance for the validation APK, only for pushes to this
    # repository's own branches (never for pull requests). The only job with
    # OIDC/attestation rights; it builds nothing and checks the hash first.
    if: github.event_name == 'push'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the validation APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horizon-validation-apk-debug
          path: apk
      - name: Check the recorded sha256
        working-directory: apk
        run: sha256sum -c app-debug.apk.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: apk/app-debug.apk

  vulnerability-audit:
    name: vulnerability-audit
    # Known vulnerabilities in the resolved Dart and npm dependencies. The
    # scanner binary is pinned by version and sha256; exceptions live in
    # osv-scanner.toml with a reason and an expiry.
    runs-on: ubuntu-latest
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan lockfiles
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --config=osv-scanner.toml \
            --lockfile=pubspec.lock \
            --lockfile=pnpm-lock.yaml:apps/engineering-console/pnpm-lock.yaml

  studio-e2e:
    name: studio-e2e
    # V1 gate: a real browser drives the Console "Hello Halo" panel against a
    # real Companion and the official emulator (EMULATED, never HALO_REAL).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Flutter (Dart for the Companion)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.2'
          cache: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official halo-emulator (pinned SDK revision)
        run: |
          python -m venv "$RUNNER_TEMP/halo-emulator"
          "$RUNNER_TEMP/halo-emulator/bin/pip" install -r tooling/e2e/requirements-halo-emulator.txt
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/engineering-console/pnpm-lock.yaml
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Install Console
        working-directory: apps/engineering-console
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: apps/engineering-console
        run: pnpm exec playwright install --with-deps chromium
      - name: Hello Halo UI journey (Console + Companion + official emulator)
        working-directory: apps/engineering-console
        env:
          HORIZON_E2E_PYTHON: ${{ runner.temp }}/halo-emulator/bin/python
          HORIZON_STUDIO_E2E_ARTIFACTS: ${{ runner.temp }}/studio-e2e
          HORIZON_STUDIO_E2E_WORKSPACE: ${{ runner.temp }}/studio-e2e-workspace
        run: pnpm exec playwright test
      - name: Upload Studio journey screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-hello-halo-journey
          path: ${{ runner.temp }}/studio-e2e
          if-no-files-found: warn

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/engineering-console/pnpm-lock.yaml
      - name: Install
        working-directory: apps/engineering-console
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: apps/engineering-console
        run: pnpm test
      - name: Type check
        working-directory: apps/engineering-console
        run: pnpm lint
      - name: Build
        working-directory: apps/engineering-console
        run: pnpm build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error