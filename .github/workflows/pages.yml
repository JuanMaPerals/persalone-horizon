name: Deploy HORIZON public shell to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/engineering-console/pnpm-lock.yaml
      - name: Install
        working-directory: apps/engineering-console
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: apps/engineering-console
        run: pnpm test
      - name: Type check
        working-directory: apps/engineering-console
        run: pnpm lint
      - name: Build public shell
        working-directory: apps/engineering-console
        run: pnpm build
      - name: Disable Jekyll
        run: touch apps/engineering-console/dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/engineering-console/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
